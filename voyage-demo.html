<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voyage Close Scene Demo · Yahweh's World</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1a2b' stroke='%23c9a227'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23c9a227'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b1a2b; overflow: hidden; }
    body { font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #f0e9d8; }
    canvas#stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
      padding: 12px 16px; background: linear-gradient(#0b1a2bd0, #0b1a2b00);
      pointer-events: none;
    }
    #banner h1 {
      font-family: Spectral, Georgia, serif; font-weight: 600; font-size: 17px;
      margin: 0; color: #f2d071; letter-spacing: .01em;
    }
    #banner p { margin: 0; font-size: 11.5px; color: #c9d3dd; opacity: .85; max-width: 62ch; }
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 16px 14px; background: linear-gradient(#0b1a2b00, #0b1a2be6);
    }
    #hud button {
      appearance: none; font: inherit; font-size: 12px; cursor: pointer;
      background: #14263bcc; color: #f0e9d8; border: 1px solid #f2d07155;
      padding: 6px 12px; border-radius: 3px;
    }
    #hud button:hover { border-color: #f2d071; }
    #hud button[aria-pressed="true"] { border-color: #f2d071; color: #f2d071; }
    #hud .spacer { flex: 1; }
    #hud .hint { font-size: 11px; color: #9fb0bf; }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #0b1a2b; font-family: Spectral, Georgia, serif; font-size: 18px; color: #c9a227;
    }
    #loading[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="banner">
    <h1>近景示例 · Voyage Close Scene</h1>
    <p>验证用的独立场景，还没接进正式网站。真实水面 + 生成船体/人物 + 阴影，检验能不能做到"football mini"那种可爱又细致的效果。</p>
  </div>

  <div id="loading">正在加载船与人物…</div>

  <div id="hud">
    <button id="toggle-anim" type="button" aria-pressed="true">暂停动作</button>
    <button id="toggle-outline" type="button" aria-pressed="true">卡通轮廓：开</button>
    <button id="toggle-orbit" type="button" aria-pressed="true">自动环绕：开</button>
    <span class="spacer"></span>
    <span class="hint">拖动旋转 · 滚轮缩放</span>
  </div>

  <script type="module" src="/src/voyage-demo/main.ts"></script>
</body>
</html>
