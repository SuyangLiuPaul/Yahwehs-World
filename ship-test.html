<!doctype html><meta charset="utf-8"><title>ship test</title>
<style>html,body{margin:0;height:100%;background:#0e2033}canvas{display:block}</style>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);
r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.3;
document.body.append(r.domElement);
const sc=new T.Scene();sc.background=new T.Color('#16283c');
sc.add(new T.HemisphereLight('#dbe4ea','#42586b',2));
const sun=new T.DirectionalLight('#ffd9a0',3);sun.position.set(-9,6,6);sc.add(sun);
const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,200);cam.position.set(3,2,4);
const ctl=new OrbitControls(cam,r.domElement);
new GLTFLoader().load('/ship-test.glb',g=>{
  const box=new T.Box3().setFromObject(g.scene),size=box.getSize(new T.Vector3()),c=box.getCenter(new T.Vector3());
  const s=3/Math.max(size.x,size.y,size.z);g.scene.scale.setScalar(s);
  g.scene.position.sub(c.multiplyScalar(s));
  sc.add(g.scene);ctl.target.set(0,0,0);ctl.update();
  document.title='loaded '+size.toArray().map(n=>n.toFixed(2)).join(' x ');
});
r.setAnimationLoop(()=>{ctl.update();r.render(sc,cam)});
</script>
