# Only read during CI builds — a direct zip deploy ignores it, so anything that
# must hold for both paths belongs in public/ as well.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /structures.html was the page of measurement cards. The cards now live in the
# walk that holds the thing each one measures, so the page is gone and this is
# the only thing standing between an existing link and a 404.
#
# The tabernacle is the target because it holds the most of what that page was:
# the ark of the covenant, the court and the lampstand, three of its eight
# cards. No fragment is given here on purpose — a redirect target with one
# would overwrite the reader's, and every deep link that page took was a
# fragment. `/structures.html#pillars` therefore arrives as
# `/tabernacle.html#pillars`, which the panel recognises as a card belonging to
# another walk and forwards to /temple.html (src/structures/panel.ts).
[[redirects]]
  from = "/structures.html"
  to = "/tabernacle.html"
  status = 301
  force = true

# Public data filenames are stable. Revalidate them so source corrections
# reach returning readers; only Vite's content-hashed assets are immutable.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
