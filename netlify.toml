# Only read during CI builds — a direct zip deploy ignores it, so anything that
# must hold for both paths belongs in public/ as well.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The globe ships ~6 MB of geography and a place bundle that change only when
# the data is rebuilt, so they are safe to pin for a year and cheap to bust:
# a rebuild writes new content, and the filename-hashed bundles carry the code.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
