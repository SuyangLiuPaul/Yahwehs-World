# Only read during CI builds — a direct zip deploy ignores it, so anything that
# must hold for both paths belongs in public/ as well.
[build]
  command = "npm run build && node scripts/check-budget.mjs"
  publish = "dist"

# The picture feedback button posts to /api/feedback (netlify/functions/feedback.mjs). It needs RESEND_API_KEY and FEEDBACK_TO set on
# the site (names only here; docs/gallery-release-checklist.md); without them the function answers 503 and the page offers a mailto: link.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # The picture-gallery release builds only the home page, the scenes and the reader (vite.config.ts, scripts/lib/vite-gallery-surface.mjs).
  # `VITE_SURFACE=full npm run build` is the whole site. The build needs public/pictures/ (scripts/build-pictures.mjs, T7 drive) and public/data/reader/ (scripts/reader-editions.mjs, the Words checkout), so a
  # Netlify CI build of the gallery fails on purpose; deploy with tools/release_web.sh, which builds locally.
  VITE_SURFACE = "gallery"

# /structures.html was the page of measurement cards. The cards now live in the
# walk that holds the thing each one measures, so the page is gone and this is
# the only thing standing between an existing link and a 404.
#
# The tabernacle is the target because it holds the most of what that page was:
# the ark of the covenant, the court and the lampstand, three of its eight
# cards. No fragment is given here on purpose — a redirect target with one
# would overwrite the reader's, and every deep link that page took was a
# fragment. `/structures.html#pillars` therefore arrives as
# `/tabernacle.html#pillars`, which the panel recognises as a card belonging to
# another walk and forwards to /temple.html (src/structures/panel.ts).
[[redirects]]
  from = "/structures.html"
  to = "/tabernacle.html"
  status = 301
  force = true

# Caching, by whether the file name can change under the same URL.
#
#   hashed   Vite writes /assets/<name>-<content hash>.js|css and the packed map
#            /assets/world.bin-<hash>.gz: a new build is a new URL, so the old
#            one can be kept for a year.
#   stable   everything else keeps its name when its content changes (pages, the
#            /data/*.json files, version.json, models, images), so it must be
#            revalidated: "no-cache" stores it but asks the server (a 304 is a
#            few hundred bytes) before every use.
# Netlify applies the matching rules in order and a later Cache-Control replaces
# an earlier one. /assets/ also holds a few unhashed folders copied from public/
# (character-cutouts, ark-cutouts, scene-assembly-references); the patterns below
# name file types, not the folder, so those stay revalidated.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"

# Public data filenames are stable. Revalidate them so source corrections
# reach returning readers; only Vite's content-hashed assets are immutable.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
