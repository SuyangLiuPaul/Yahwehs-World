# Builds the desktop shell (Windows/macOS/Linux) via Tauri and attaches the
# installers to the run as downloadable artifacts. Manual trigger only —
# there is no code-signing cert configured yet, so these are unsigned builds
# (Windows shows a SmartScreen prompt, macOS a Gatekeeper prompt; both are
# bypassable, neither is a build failure). Windows in particular can only be
# produced here: Tauri does not cross-compile a Windows target from macOS.
name: Desktop build
on:
  workflow_dispatch: {}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install frontend dependencies
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: yahwehs-globe-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: warn
