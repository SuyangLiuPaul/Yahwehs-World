<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inside the Tabernacle · Yahweh's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>

  <nav class="sitenav">
    <a class="brand" href="/">
      <span class="zh">雅伟之界</span>
      <span class="en">The Biblical Globe</span>
    </a>
    <ol>
      <li><a class="tab" href="/" data-en="The Globe" data-zh="圣经世界">The Globe</a></li>
      <li><a class="tab" href="/structures.html" data-en="By the Measure" data-zh="照着经文的尺寸">By the Measure</a></li>
      <li><a class="tab" href="/tabernacle.html" aria-current="page" data-en="The Tabernacle" data-zh="走进会幕">The Tabernacle</a></li>
    </ol>
    <span class="spacer"></span>
    <button class="lang-switch" type="button">中文</button>
  </nav>

  <div id="gate">
    <div class="gate-inner">
      <p class="eyebrow" data-en="Exodus 26–27" data-zh="出埃及记 26–27 章">Exodus 26–27</p>
      <h1 data-en="Inside the Tabernacle" data-zh="走进会幕">Inside the Tabernacle</h1>
      <p class="lede"
         data-en="The court, its hangings, pillars, boards, sockets, bars and curtains are all generated from the counts the passage gives. Exodus does not only state dimensions — it records how many there were of each thing, so these numbers are arithmetic rather than design. The lampstand, the table of the Presence and the altar of incense are built from their own stated measurements."
         data-zh="院子、帷子、柱子、竖板、卯座、闩、幔子——全部按经文给的数量生成。经文不只给尺寸，还把每样东西数了几个都记下来，所以这些数字不是设计，是算出来的。圣所里的金灯台、陈设饼的桌子、香坛，同样按各自经文所给的尺寸生成。">
        The court, its hangings, pillars, boards, sockets, bars and curtains are all generated from
        the counts the passage gives.
      </p>

      <div class="tally" id="tally"></div>

      <div class="gate-go">
        <button id="tour" type="button" class="primary">
          <span data-en="Walk me through" data-zh="带我走一遍">Walk me through</span>
        </button>
        <button id="enter" type="button"><span data-en="Walk it myself" data-zh="自己走">Walk it myself</span></button>
        <p class="keys">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span data-en="move" data-zh="走动">move</span>
          <kbd>Shift</kbd><span data-en="run" data-zh="快走">run</span>
          <span data-en="mouse to look" data-zh="鼠标转头">mouse to look</span>
          <kbd>Esc</kbd><span data-en="exit" data-zh="退出">exit</span>
        </p>
      </div>
    </div>
  </div>

  <div id="hud" hidden>
    <div id="tour-bar" hidden><i></i></div>
    <!-- A plan of the enclosure with the walker on it. In a space made of
         nested rectangles, knowing which one you are inside is most of
         knowing where you are. -->
    <svg id="plan" viewBox="0 0 132 74" aria-hidden="true">
      <rect class="p-court" x="1" y="1" width="130" height="72"></rect>
      <rect class="p-tent"  x="14" y="19" width="52" height="36"></rect>
      <line  class="p-veil" x1="40" y1="19" x2="40" y2="55"></line>
      <rect class="p-altar" x="92" y="30" width="14" height="14"></rect>
      <circle id="p-you" class="p-you" cx="120" cy="37" r="3.4"></circle>
    </svg>
    <div class="hud-text">
      <div id="where"></div>
      <div id="verse"></div>
    </div>
    <div class="hud-side">
      <button id="tour-toggle" type="button" hidden>❚❚</button>
      <p class="hud-keys"><kbd>Esc</kbd> <span data-en="exit" data-zh="退出">exit</span></p>
    </div>
  </div>

  <script type="module" src="/src/walk/main.ts"></script>
</body>
</html>
