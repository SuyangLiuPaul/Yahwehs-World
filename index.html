<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>雅伟之界 · 圣经世界 | Yahweh's World — The Biblical Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="loading"><div class="mark">✦</div><p id="loading-text" data-en="Drawing the world…" data-zh="正在绘制世界…">Drawing the world…</p></div>

  <nav class="sitenav">
    <a class="brand" href="/">
      <span class="zh">雅伟之界</span>
      <span class="en">The Biblical Globe</span>
    </a>
    <ol>
      <li><a class="tab" href="/" aria-current="page" data-en="The Globe" data-zh="圣经世界">The Globe</a></li>
      <li><a class="tab" href="/structures.html" data-en="By the Measure" data-zh="照着经文的尺寸">By the Measure</a></li>
      <li><a class="tab" href="/tabernacle.html" data-en="The Tabernacle" data-zh="走进会幕">The Tabernacle</a></li>
    </ol>
    <span class="spacer"></span>
    <button class="lang-switch" type="button">中文</button>
  </nav>

  <aside id="panel" hidden>
    <button id="panel-close" type="button" aria-label="close">×</button>
    <h2 id="p-name"></h2>
    <p id="p-modern"></p>
    <div id="p-badges"></div>
    <dl id="p-meta"></dl>
    <h3 id="p-refs-title"></h3>
    <p id="p-refs"></p>
  </aside>

  <nav id="routes" data-state="closed">
    <button id="r-open" type="button" aria-expanded="false">
      <span class="rlabel" data-en="Routes" data-zh="路线">Routes</span>
      <span class="r-open-name" data-en="Choose a journey" data-zh="选一条走过的路">Choose a journey</span>
      <span class="r-chev" aria-hidden="true">▾</span>
    </button>

    <div id="rlist" role="list"></div>

    <article id="r-card" hidden>
      <header>
        <h2 id="r-name"></h2>
        <button id="r-clear" type="button" aria-label="退出路线">×</button>
      </header>
      <p id="r-range"></p>
      <div id="r-stats"></div>
      <div id="rplay">
        <button id="r-toggle" type="button" aria-label="播放">▶</button>
        <span id="r-stop"></span>
      </div>
      <details id="r-why">
        <summary data-en="Basis" data-zh="依据">Basis</summary>
        <p id="r-basis"></p>
      </details>
    </article>
  </nav>

  <footer id="timeline">
    <div class="readout">
      <div class="reading">
        <button id="t-play" type="button" aria-label="play">▶</button>
        <span id="t-ref"></span>
        <span id="t-here"></span>
      </div>
      <span id="t-count"></span>
    </div>
    <input id="t-range" type="range" min="0" max="1" value="1" step="1">
    <div class="legend" id="legend"></div>
    <p class="credit">
      <span data-en="Place data" data-zh="地名数据">Place data</span>
      <a href="https://www.openbible.info/geo/" target="_blank" rel="noopener">OpenBible.info</a> · CC BY 4.0 ·
      <span data-en="basemap Natural Earth (public domain)" data-zh="底图 Natural Earth（公有领域）">basemap Natural Earth (public domain)</span>
    </p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
