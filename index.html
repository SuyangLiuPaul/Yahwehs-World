<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>雅伟之界 · 圣经世界 | Yahweh's World — The Biblical Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="loading"><div class="mark">✦</div><p id="loading-text">正在绘制世界…</p></div>

  <nav class="sitenav">
    <a class="brand" href="/">
      <span class="zh">雅伟之界</span>
      <span class="en">The Biblical Globe</span>
    </a>
    <ol>
      <li><a class="tab" href="/" aria-current="page">圣经世界</a></li>
      <li><a class="tab" href="/structures.html">照着经文的尺寸</a></li>
      <li><a class="tab" href="/tabernacle.html">走进会幕</a></li>
    </ol>
    <span class="spacer"></span>
    <button id="lang" type="button">EN</button>
  </nav>

  <aside id="panel" hidden>
    <button id="panel-close" type="button" aria-label="close">×</button>
    <h2 id="p-name"></h2>
    <p id="p-modern"></p>
    <div id="p-badges"></div>
    <dl id="p-meta"></dl>
    <h3 id="p-refs-title"></h3>
    <p id="p-refs"></p>
  </aside>

  <nav id="routes" data-state="closed">
    <button id="r-open" type="button" aria-expanded="false">
      <span class="rlabel">路线</span>
      <span class="r-open-name">选一条走过的路</span>
      <span class="r-chev" aria-hidden="true">▾</span>
    </button>

    <div id="rlist" role="list"></div>

    <article id="r-card" hidden>
      <header>
        <h2 id="r-name"></h2>
        <button id="r-clear" type="button" aria-label="退出路线">×</button>
      </header>
      <p id="r-range"></p>
      <div id="r-stats"></div>
      <div id="rplay">
        <button id="r-toggle" type="button" aria-label="播放">▶</button>
        <span id="r-stop"></span>
      </div>
      <details id="r-why">
        <summary>依据</summary>
        <p id="r-basis"></p>
      </details>
    </article>
  </nav>

  <footer id="timeline">
    <div class="readout">
      <div class="reading">
        <button id="t-play" type="button" aria-label="play">▶</button>
        <span id="t-ref"></span>
        <span id="t-here"></span>
      </div>
      <span id="t-count"></span>
    </div>
    <input id="t-range" type="range" min="0" max="1" value="1" step="1">
    <div class="legend" id="legend"></div>
    <p class="credit">
      地名数据 <a href="https://www.openbible.info/geo/" target="_blank" rel="noopener">OpenBible.info</a> · CC BY 4.0 ·
      底图 Natural Earth（公有领域）
    </p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
