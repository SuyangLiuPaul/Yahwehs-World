<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件图进度</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#faf6ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="事件图">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#faf6ea;--panel:#fffdf6;--ink:#3b3222;--mute:#8a7d62;--line:#e3d9bd;--gold:#c8963e;
  --ok:#5f9a4a;--new:#d9a13a;--redo:#c0553a;--todo:#cfc6ab;--shadow:0 1px 3px rgba(60,45,20,.15);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1912;--panel:#26221a;--ink:#efe6cf;--mute:#a09678;--line:#3a3426;--gold:#d9a94f;
  --ok:#7dbb66;--new:#e6b34e;--redo:#e0765a;--todo:#4a4331;--shadow:0 1px 3px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 20px 8px;max-width:1800px;margin:auto}
h1{font-size:20px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
h1 small{font-weight:400;color:var(--mute);font-size:13px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--todo)}
.stack i{display:block;height:100%}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:104px;cursor:pointer;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{color:var(--mute);font-size:12px}
.stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.stat.on{outline:2px solid var(--gold)}
.eta{color:var(--mute);margin:6px 0 0;font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}
.bar .in{max-width:1800px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
input[type=search],select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;color:inherit;background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold);color:#fff}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:13px}
.count{margin-left:auto;color:var(--mute);font-size:13px}
details.books{max-width:1800px;margin:10px auto 0;padding:0 20px}
details.books summary{cursor:pointer;color:var(--mute);font-size:13px}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;margin-top:8px}
.bk button{font:inherit;color:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 7px 5px;cursor:pointer;position:relative;overflow:hidden}
.bk button.on{outline:2px solid var(--gold)}
.bk b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk em{font-style:normal;font-size:11px;color:var(--mute)}
.bk .f{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.bk .p{position:absolute;left:0;bottom:0;height:3px;background:var(--new);opacity:.8}
main{max-width:1800px;margin:auto;padding:6px 20px 60px}
h3{margin:22px 0 8px;font-size:15px;display:flex;gap:10px;align-items:baseline}
h3 small{color:var(--mute);font-weight:400}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,210px),1fr));gap:10px}
.c{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column}
.c .im{aspect-ratio:16/9;background:var(--todo);position:relative}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;padding:6px}
.c .t{padding:6px 9px 8px}
.c .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .t span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .tag{position:absolute;top:6px;left:6px;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;background:var(--todo)}
.c.ok .tag{background:var(--ok)}.c.new .tag{background:var(--new)}.c.redo .tag,.c.bad .tag{background:var(--redo)}
.c .ago{position:absolute;top:6px;right:6px;font-size:11px;padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff}
.c.todo{opacity:.55;box-shadow:none}
.empty{color:var(--mute);padding:40px 0;text-align:center}
#lb{position:fixed;inset:0;background:rgba(15,12,6,.86);z-index:20;display:none;grid-template-columns:1fr 340px}
#lb.show{display:grid}
#lb .stage{display:grid;place-items:center;padding:16px;min-width:0;position:relative}
#lb .stage img{max-width:100%;max-height:calc(100vh - 32px);border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#lb aside{background:var(--panel);padding:18px 18px 24px;overflow:auto}
#lb h2{margin:0 0 2px;font-size:19px}
#lb .en{color:var(--mute);margin-bottom:8px}
#lb .ref{font-weight:600;margin-bottom:6px}
#lb p{margin:8px 0}
#lb .meta{color:var(--mute);font-size:12.5px}
#lb .rej{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#lb .rej a{display:block;width:96px;border:2px solid var(--redo);border-radius:6px;overflow:hidden}
#lb .rej img{width:100%;display:block}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
#lb .prev{left:12px}#lb .next{right:12px}
#lb .x{position:absolute;top:10px;right:14px;font-size:22px;background:none;border:0;color:#fff;cursor:pointer}
.badge{display:inline-block;padding:1px 9px;border-radius:9px;color:#fff;font-size:12px}
@media (max-width:820px){
  #lb{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  #lb .stage img{max-height:52vh}
  input[type=search]{width:100%}
  .count{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>事件图进度 <small id="gen"></small></h1>
  <div class="stack" id="stack"></div>
  <div class="stats" id="stats"></div>
  <p class="eta" id="eta"></p>
</header>

<div class="bar"><div class="in">
  <input type="search" id="q" placeholder="搜索 标题 / 经文 / 摘要">
  <select id="sort">
    <option value="new">最新生成在前</option>
    <option value="old">最早生成在前</option>
    <option value="bible">圣经顺序（分卷）</option>
    <option value="year">年代顺序</option>
  </select>
  <select id="book"></select>
  <span class="seg" id="test">
    <button data-v="">全部</button><button data-v="ot">旧约</button><button data-v="nt">新约</button>
  </span>
  <label class="chk">图大小 <input type="range" id="size" min="120" max="460" value="210"></label>
  <label class="chk"><input type="checkbox" id="auto"> 每分钟自动刷新</label>
  <span class="count" id="count"></span>
</div></div>

<details class="books" id="bkwrap" open>
  <summary>按书卷看进度（点一卷筛选，再点取消）</summary>
  <div class="bk" id="bk"></div>
</details>

<main id="main"></main>

<div id="lb">
  <div class="stage">
    <button class="x" id="lbx" aria-label="关闭">✕</button>
    <button class="nav prev" id="lbp" aria-label="上一张">‹</button>
    <img id="lbi" alt="">
    <button class="nav next" id="lbn" aria-label="下一张">›</button>
  </div>
  <aside id="lbm"></aside>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.events, BOOKS = D.books;
const LABEL = {ok:'已通过', new:'待审核', redo:'返工中', bad:'放弃', todo:'未做'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const full = id => D.site ? `full/${id}.jpg` : `raw/${id}.png`;
const madeSet = e => e.st === 'ok' || e.st === 'new' || e.st === 'bad';

// filter state, kept in the URL hash so a refresh keeps the view
const S = {status:'made', sort:'new', book:'', test:'', q:'', size:210, auto:false};
try { Object.assign(S, JSON.parse(decodeURIComponent(location.hash.slice(1)))); } catch (e) {}
const save = () => { try { history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(S))); } catch (e) {} };

function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 90) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
const when = t => new Date(t * 1000).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});

// header: stacked bar, stat pills, rate and estimate
const n = st => E.filter(e => e.st === st).length;
const cnt = {ok:n('ok'), new:n('new'), redo:n('redo'), bad:n('bad'), todo:n('todo')};
const made = cnt.ok + cnt.new + cnt.bad, total = E.length;
$('gen').textContent = `${made} / ${total}（${(100 * made / total).toFixed(1)}%）· 页面生成于 ${when(D.now)}`;
$('stack').innerHTML = [['ok', cnt.ok], ['new', cnt.new], ['bad', cnt.bad]]
  .map(([k, v]) => `<i style="width:${100 * v / total}%;background:var(--${k === 'bad' ? 'redo' : k})" title="${LABEL[k]} ${v}"></i>`).join('');
const pills = [['made', '已做', made, 'var(--gold)'], ['ok', '已通过', cnt.ok, 'var(--ok)'], ['new', '待审核', cnt.new, 'var(--new)'],
  ['redo', '返工中', cnt.redo + '', 'var(--redo)'], ['todo', '未做', cnt.todo, 'var(--todo)'], ['all', '全部', total, 'var(--mute)']];
function drawStats() {
  $('stats').innerHTML = pills.map(([k, l, v, c]) =>
    `<div class="stat ${S.status === k ? 'on' : ''}" data-k="${k}"><b>${v}</b><span><i class="dot" style="background:${c}"></i>${l}</span></div>`).join('');
}
const tries = E.reduce((a, e) => a + e.tries, 0);
const times = E.filter(e => e.made).map(e => e.made).sort((a, b) => a - b);
let eta = `共重做过 ${tries} 张。`;
if (times.length >= 4) {
  const recent = times.slice(-12);
  const span = recent[recent.length - 1] - recent[0];
  const rate = span > 0 ? (recent.length - 1) / (span / 3600) : 0;
  if (rate > 0) {
    const left = cnt.todo + cnt.redo, h = left / rate;
    eta += ` 最近速度 ${rate.toFixed(1)} 张/小时，剩 ${left} 张，大约还要 ${h < 48 ? h.toFixed(0) + ' 小时' : (h / 24).toFixed(1) + ' 天'}。`;
  }
}
$('eta').textContent = eta;

// controls
$('book').innerHTML = '<option value="">全部书卷</option>' + BOOKS.map(b =>
  `<option value="${b.b}">${esc(b.zh)} ${esc(b.en)}（${b.made}/${b.n}）</option>`).join('');
$('bk').innerHTML = BOOKS.map(b =>
  `<button data-b="${b.b}" title="${esc(b.zh)} ${esc(b.en)}：已做 ${b.made}，已通过 ${b.ok}，共 ${b.n}">
   <b>${esc(b.zh)}</b><em>${b.made}/${b.n}</em>
   <i class="p" style="width:${100 * b.made / b.n}%"></i><i class="f" style="width:${100 * b.ok / b.n}%"></i></button>`).join('');

function sync() {
  $('q').value = S.q; $('sort').value = S.sort; $('book').value = S.book; $('size').value = S.size; $('auto').checked = S.auto;
  document.querySelectorAll('#test button').forEach(b => b.classList.toggle('on', b.dataset.v === S.test));
  document.querySelectorAll('#bk button').forEach(b => b.classList.toggle('on', b.dataset.b === String(S.book)));
  document.documentElement.style.setProperty('--w', S.size + 'px');
  drawStats();
}

let list = [];
function cardHTML(e, i) {
  const im = madeSet(e)
    ? `<img loading="lazy" src="thumbs/${e.id}.jpg" alt="">`
    : `<div class="ph">${esc(e.en)}</div>`;
  const ago_ = e.made ? `<span class="ago">${ago(e.made)}</span>` : '';
  const tag = e.tries && madeSet(e) ? `${LABEL[e.st]}·重做${e.tries}` : LABEL[e.st];
  return `<div class="c ${e.st}" data-i="${i}"><div class="im">${im}<span class="tag">${tag}</span>${ago_}</div>
    <div class="t"><b>${esc(e.zh)}</b><span>${esc(e.refZh)}</span></div></div>`;
}
function render() {
  const q = S.q.trim().toLowerCase();
  list = E.filter(e => {
    if (S.status === 'made' && !madeSet(e)) return false;
    if (['ok', 'new', 'redo', 'todo'].includes(S.status) && e.st !== S.status) return false;
    if (S.book && e.b !== +S.book) return false;
    if (S.test === 'ot' && e.b > 39) return false;
    if (S.test === 'nt' && e.b <= 39) return false;
    if (q && !(e.zh + e.en + e.refZh + e.ref + e.sum).toLowerCase().includes(q)) return false;
    return true;
  });
  if (S.sort === 'new') list.sort((a, b) => (b.made || 0) - (a.made || 0) || a.i - b.i);
  else if (S.sort === 'old') list.sort((a, b) => (a.made || 9e15) - (b.made || 9e15) || a.i - b.i);
  else if (S.sort === 'year') list.sort((a, b) => (a.y ?? 0) - (b.y ?? 0) || a.i - b.i);
  $('count').textContent = `显示 ${list.length} 张`;
  if (!list.length) { $('main').innerHTML = '<div class="empty">没有符合的事件</div>'; return; }
  let h = '';
  if (S.sort === 'bible' && !S.book) {
    let cur = null, buf = [];
    const flush = () => { if (buf.length) { const B = BOOKS.find(x => x.b === cur); h += `<h3>${esc(B.zh)} <small>${esc(B.en)} · 已做 ${B.made}/${B.n}</small></h3><div class="g">${buf.join('')}</div>`; buf = []; } };
    list.forEach((e, i) => { if (e.b !== cur) { flush(); cur = e.b; } buf.push(cardHTML(e, i)); });
    flush();
  } else h = `<div class="g">${list.map(cardHTML).join('')}</div>`;
  $('main').innerHTML = h;
}
function update() { save(); sync(); render(); }

// events
$('q').oninput = e => { S.q = e.target.value; update(); };
$('sort').onchange = e => { S.sort = e.target.value; update(); };
$('book').onchange = e => { S.book = e.target.value; update(); };
$('size').oninput = e => { S.size = +e.target.value; save(); document.documentElement.style.setProperty('--w', S.size + 'px'); };
$('auto').onchange = e => { S.auto = e.target.checked; save(); };
$('test').onclick = e => { if (e.target.dataset.v !== undefined) { S.test = e.target.dataset.v; update(); } };
$('stats').onclick = e => { const c = e.target.closest('.stat'); if (c) { S.status = c.dataset.k; update(); } };
$('bk').onclick = e => { const c = e.target.closest('button'); if (c) { S.book = S.book == c.dataset.b ? '' : c.dataset.b; if (S.book && S.status === 'made') S.status = 'all'; update(); } };
$('main').onclick = e => { const c = e.target.closest('.c'); if (c) open(+c.dataset.i); };

// viewer
let cur = -1;
function open(i) {
  cur = i; const e = list[i]; if (!e) return;
  $('lb').classList.add('show');
  $('lbi').src = madeSet(e) ? full(e.id) : '';
  $('lbi').style.display = madeSet(e) ? '' : 'none';
  const rej = e.rej.map(f => `<a href="${D.site ? 'thumbs/' + f.replace('.png', '.jpg') : 'rejected/' + f}" target="_blank" title="${esc(f)}"><img src="thumbs/${f.replace('.png', '.jpg')}" alt=""></a>`).join('');
  $('lbm').innerHTML = `<h2>${esc(e.zh)}</h2><div class="en">${esc(e.en)}</div>
    <div class="ref">${esc(e.refZh)}</div>
    <p><span class="badge" style="background:var(--${e.st === 'bad' ? 'redo' : e.st})">${LABEL[e.st]}</span></p>
    <p>${esc(e.sum)}</p>
    <p class="meta">${e.made ? '生成于 ' + when(e.made) + '（' + ago(e.made) + '）<br>' : ''}事件 ${e.i + 1} / ${total} · ${esc(e.id)}${e.y != null ? '<br>年代 ' + (e.y < 0 ? '公元前 ' + (-e.y) : '公元 ' + e.y) : ''}</p>
    ${e.note ? `<p class="meta">审核意见：${esc(e.note)}</p>` : ''}
    ${e.rej.length ? `<p class="meta">被拒收的旧版（${e.rej.length}）：</p><div class="rej">${rej}</div>${e.rejNotes.map(t => `<p class="meta">· ${esc(t)}</p>`).join('')}` : ''}
    ${madeSet(e) ? `<p class="meta"><a href="${full(e.id)}" target="_blank" style="color:var(--gold)">在新窗口打开原图</a></p>` : ''}`;
}
const close = () => { $('lb').classList.remove('show'); cur = -1; };
const step = d => { if (cur >= 0) open((cur + d + list.length) % list.length); };
$('lbx').onclick = close; $('lbp').onclick = () => step(-1); $('lbn').onclick = () => step(1);
$('lb').onclick = e => { if (e.target === $('lb') || e.target.classList.contains('stage')) close(); };
document.onkeydown = e => {
  if (cur < 0) return;
  if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
};

setInterval(() => { if (S.auto && cur < 0) location.reload(); }, 60000);
if (D.site && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (innerWidth < 820) $('bkwrap').removeAttribute('open');
update();
</script>
</body>
</html>
